<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📅 Calendario Semanal</title>
  
  <!-- Mismo CSS que arriba -->
  <!-- ... (copia el CSS de la versión anterior) ... -->
</head>
<body>
  <div id="app">
    <!-- Mismo HTML que arriba -->
    <!-- ... (copia el HTML de la versión anterior) ... -->
  </div>
  
  <script>
    // ============================================================
    // VERSIÓN LOCALSTORAGE (Sin Firebase)
    // ============================================================
    new Vue({
      el: '#app',
      
      data: {
        personas: [],
        eventos: {},
        semanaActual: 0,
        mostrarSabado: false,
        semanasDisponibles: [],
        toastVisible: false,
        toastMensaje: '',
        timeoutToast: null,
        diasBase: ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes'],
        personasDefecto: [
          'L.Minetti', 'S.Vega', 'G.Ramirez', 'Corbalan Bueno Santiago',
          'Yannick Durand', 'N.Turati', 'V.Garcia', 'N.Valencia',
          'D.Rivero', 'M.Alvarez Bocco', 'P.Garcia', 'M.Garcia',
          'Agustina Castelli', 'E.Garcia'
        ],
        estados: ['', 'Presencial', 'Home Office', 'Comisión', 'Licencia'],
        conectado: true // Siempre verdadero en localStorage
      },
      
      computed: {
        diasMostrados() {
          return this.mostrarSabado ? [...this.diasBase, 'Sábado'] : this.diasBase;
        },
        fechasDias() {
          return this.diasMostrados.map((dia, idx) => {
            const fecha = this.obtenerFechaDia(idx);
            return fecha ? `${fecha.getDate().toString().padStart(2,'0')}/${(fecha.getMonth()+1).toString().padStart(2,'0')}` : '--/--';
          });
        },
        personasOrdenadas() {
          return this.personas.sort((a, b) => a.nombre.localeCompare(b.nombre));
        },
        personasActivas() {
          let count = 0;
          this.personas.forEach(p => {
            const tiene = this.diasMostrados.some(d => {
              const estado = this.getEstado(p.id, d);
              return estado && estado !== '';
            });
            if (tiene) count++;
          });
          return count;
        },
        totalEventosSemana() {
          let count = 0;
          this.personas.forEach(p => {
            this.diasMostrados.forEach(d => {
              if (this.getEstado(p.id, d) && this.getEstado(p.id, d) !== '') count++;
            });
          });
          return count;
        },
        totalPresencial() { return this.contarGlobal('Presencial'); },
        totalHome() { return this.contarGlobal('Home Office'); },
        totalComision() { return this.contarGlobal('Comisión'); },
        totalLicencia() { return this.contarGlobal('Licencia'); },
        totalAsignados() {
          return this.totalPresencial + this.totalHome + this.totalComision + this.totalLicencia;
        }
      },
      
      mounted() {
        this.inicializarSemanas();
        this.cargarPersonas();
        this.cargarEventos();
      },
      
      methods: {
        inicializarSemanas() {
          const hoy = new Date();
          for (let i = 3; i >= 0; i--) {
            const lunes = this.getLunesDeSemana(hoy, -i);
            const domingo = new Date(lunes);
            domingo.setDate(domingo.getDate() + 6);
            this.semanasDisponibles.push({
              id: i,
              nombre: i === 0 ? 'Esta semana' : `Semana -${i}`,
              rango: `${this.formatearFecha(lunes)} → ${this.formatearFecha(domingo)}`,
              lunes: lunes
            });
          }
          this.semanasDisponibles.reverse();
          this.semanaActual = this.semanasDisponibles.length - 1;
        },
        
        getLunesDeSemana(fecha, offsetSemanas = 0) {
          const d = new Date(fecha);
          d.setDate(d.getDate() + offsetSemanas * 7);
          const dia = d.getDay();
          const diff = d.getDate() - dia + (dia === 0 ? -6 : 1);
          return new Date(d.getFullYear(), d.getMonth(), diff);
        },
        
        formatearFecha(fecha) {
          return `${fecha.getDate().toString().padStart(2,'0')}/${(fecha.getMonth()+1).toString().padStart(2,'0')}`;
        },
        
        obtenerFechaDia(idxDia) {
          const semana = this.semanasDisponibles[this.semanaActual];
          if (!semana) return null;
          const fecha = new Date(semana.lunes);
          fecha.setDate(fecha.getDate() + idxDia);
          return fecha;
        },
        
        cargarPersonas() {
          const saved = localStorage.getItem('personas_calendario');
          if (saved) {
            try {
              this.personas = JSON.parse(saved);
              return;
            } catch(e) {}
          }
          this.personas = this.personasDefecto.map((nombre, idx) => ({
            id: `p${idx}`,
            nombre: nombre
          }));
          this.guardarPersonas();
        },
        
        guardarPersonas() {
          localStorage.setItem('personas_calendario', JSON.stringify(this.personas));
        },
        
        cargarEventos() {
          const saved = localStorage.getItem('eventos_calendario');
          if (saved) {
            try {
              this.eventos = JSON.parse(saved);
            } catch(e) {
              this.eventos = {};
            }
          }
        },
        
        guardarEventos() {
          localStorage.setItem('eventos_calendario', JSON.stringify(this.eventos));
        },
        
        getEstado(personaId, dia) {
          const semana = this.semanasDisponibles[this.semanaActual];
          if (!semana) return '';
          const key = `${personaId}_${semana.id}_${dia}`;
          return this.eventos[key] || '';
        },
        
        cambiarEstado(personaId, dia) {
          const semana = this.semanasDisponibles[this.semanaActual];
          if (!semana) return;
          const actual = this.getEstado(personaId, dia);
          const idx = this.estados.indexOf(actual);
          const siguiente = this.estados[(idx + 1) % this.estados.length];
          const key = `${personaId}_${semana.id}_${dia}`;
          this.$set(this.eventos, key, siguiente);
          this.guardarEventos();
        },
        
        getClaseEstado(estado) {
          if (!estado || estado === '') return 'vacio';
          const map = {
            'Presencial': 'presencial',
            'Home Office': 'home',
            'Comisión': 'comision',
            'Licencia': 'licencia'
          };
          return map[estado] || 'vacio';
        },
        
        getLabelEstado(estado) {
          if (!estado || estado === '') return '—';
          const map = {
            'Presencial': 'Pres',
            'Home Office': 'Home',
            'Comisión': 'Com',
            'Licencia': '🏖️'
          };
          return map[estado] || estado;
        },
        
        contarEstado(personaId, estado) {
          let count = 0;
          this.diasMostrados.forEach(d => {
            if (this.getEstado(personaId, d) === estado) count++;
          });
          return count;
        },
        
        contarGlobal(estado) {
          let count = 0;
          this.personas.forEach(p => {
            this.diasMostrados.forEach(d => {
              if (this.getEstado(p.id, d) === estado) count++;
            });
          });
          return count;
        },
        
        cambiarSemana(idx) {
          this.semanaActual = idx;
        },
        
        limpiarSemanaActual() {
          if (!confirm('¿Limpiar todos los estados de esta semana?')) return;
          const semana = this.semanasDisponibles[this.semanaActual];
          if (!semana) return;
          this.personas.forEach(p => {
            this.diasMostrados.forEach(d => {
              const key = `${p.id}_${semana.id}_${d}`;
              this.$set(this.eventos, key, '');
            });
          });
          this.guardarEventos();
          this.mostrarToast('🗑️ Semana limpiada');
        },
        
        exportarCSV() {
          const semana = this.semanasDisponibles[this.semanaActual];
          if (!semana) return;
          let csv = 'Nombre,' + this.diasMostrados.join(',') + '\n';
          this.personasOrdenadas.forEach(p => {
            const fila = [p.nombre];
            this.diasMostrados.forEach(d => {
              fila.push(this.getEstado(p.id, d) || '');
            });
            csv += fila.join(',') + '\n';
          });
          const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = `calendario_${semana.rango.replace('/','-').replace(' → ','_').replace('/','-')}.csv`;
          link.click();
          URL.revokeObjectURL(link.href);
          this.mostrarToast('📊 CSV exportado');
        },
        
        mostrarToast(mensaje) {
          this.toastMensaje = mensaje;
          this.toastVisible = true;
          clearTimeout(this.timeoutToast);
          this.timeoutToast = setTimeout(() => {
            this.toastVisible = false;
          }, 3000);
        }
      }
    });
  </script>
</body>
</html>
